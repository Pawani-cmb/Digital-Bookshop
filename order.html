<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order</title>
</head>
<style>
    .form-deco {
        width: 40%;
        padding: 7px;
        border-radius: 4px;
        font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
        font-size: 14px;
        border: 2px solid #a83267;
    }

    .form-margin {
        margin-left: 10%;
    }

    label {
        font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
        font-size: 17px;
    }

    button {
        margin-top: 10px;
        background: #a83267;
        color: white;
        border: none;
        padding: 12px 25px;
        border-radius: 25px;
        cursor: pointer;
        font-size: 15px;
    }

   
    body {
        margin: 0;
        
    }
    nav {
        background-color: #a83267;
        padding: 15px;
        text-align: center;
    }

    nav a {
        color: white;
        text-decoration: none;
        font-size: 20px;
        margin: 20px;
        font-weight: bold;
    }

</style>

<body>

    <center>
        <nav>
            <a href="index.html"> home</a>
            <a href="contact.html"> contact</a>
            <a href="category.html"> category</a>
        </nav>
    </center>
    <h1>Buy Books</h1>
    <hr>
    <div class="form-margin">
        <form action="">
            <br>
            <label for="name">Name </label><br>
            <input type="text" class="form-deco" required> <br><br>

            <label>Email</label> <br>
            <input type="email" class="form-deco" required><br><br>

            <label>Phone Number</label> <br>
            <input type="tel" class="form-deco" required><br><br>

            <label>Select Book</label> <br>
            <select class="form-deco">
                <option>Harry Potter</option>
                <option>Atomic Habits</option>
                <option>Rich Dad Poor Dad</option>
                <option>The Alchemist</option>
            </select>
            <br><br>
            <label>Quantity</label> <br>
            <input type="number" min="1" value="1" class="form-deco">
            <br><br>
            <label>Payment Method</label> <br>
            <select class="form-deco">
                <option>Credit Card</option>
                <option>Debit Card</option>
                <option>PayPal</option>
            </select>
            <br><br>
            <label>Additional Notes</label> <br>
            <textarea rows="4" cols="40" class="form-deco"></textarea> <br><br>
            <button type="submit"><a href="order.html">Place Order</a></button>
            <button type="reset">Clear Form</button>
        </form>
    </div>
</body>

</html>
